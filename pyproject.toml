[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "edopro-replay2json"
version = "0.1.0"
description = "Extrae replays de Yu-Gi-Oh! EDOPro (.yrp / .yrpX) a JSON: header, decks, eventos del core, timeline y análisis. Solo stdlib."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jose" },
]
keywords = [
    "yugioh", "yu-gi-oh", "edopro", "replay", "yrp", "yrpX", "json",
    "ocgcore", "ygopro", "parser", "duel",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/josev/edopro-replay2json"

[project.scripts]
edopro-replay2json = "edopro_replay2json:main"

[tool.setuptools]
packages = ["edopro_replay2json"]
